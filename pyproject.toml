[project]
name = "labs"
version = "0.1.0"
description = "Console calculator and unit converter"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = [
    "ruff>=0.8.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]